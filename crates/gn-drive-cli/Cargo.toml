[package]
name = "gn-drive-cli"
description = "GN Drive command line (binary: gn-drive)"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "gn-drive"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
gn-drive-core = { path = "../gn-drive-core" }
libc = "0.2.191"
parking_lot = "0.13.0"
serde_json = "1.0.154"
signal-hook = "0.4.5"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
