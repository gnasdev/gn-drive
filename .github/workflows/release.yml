# GN Drive release workflow (Swift rewrite).
#
# Builds the macOS app bundle + standalone CLI on version tags (v*.*.*).
# Runs scripts/bundle-app.sh — the same path as `task dist` locally.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  APP_NAME: gn-drive

jobs:
  build:
    runs-on: macos-latest
    name: Build GNDrive.app + CLI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install rclone (bundled into the app)
        run: brew install rclone

      - name: Build app bundle
        run: scripts/bundle-app.sh release "${{ env.VERSION }}"

      - name: Package app zip
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent GNDrive.app "../GNDrive-${{ env.VERSION }}-macos.zip"
          cd ..
          shasum -a 256 "GNDrive-${{ env.VERSION }}-macos.zip" > "GNDrive-${{ env.VERSION }}-macos.zip.sha256"

      - name: Package CLI tarball
        run: |
          mkdir -p pkg
          cp dist/GNDrive.app/Contents/MacOS/gn-drive pkg/
          cp dist/GNDrive.app/Contents/MacOS/rclone pkg/
          tar czf "gn-drive-${{ env.VERSION }}-macos-arm64.tar.gz" -C pkg gn-drive rclone
          shasum -a 256 "gn-drive-${{ env.VERSION }}-macos-arm64.tar.gz" > "gn-drive-${{ env.VERSION }}-macos-arm64.tar.gz.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            GNDrive-${{ env.VERSION }}-macos.zip
            GNDrive-${{ env.VERSION }}-macos.zip.sha256
            gn-drive-${{ env.VERSION }}-macos-arm64.tar.gz
            gn-drive-${{ env.VERSION }}-macos-arm64.tar.gz.sha256
