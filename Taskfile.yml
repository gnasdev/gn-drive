# GN Drive task definitions.
#
# The app is a native Swift package: GNDriveCore (engine) + gn-drive (CLI) +
# GNDriveApp (SwiftUI macOS app). Engine runs in-process — no web server.
#
#   task build   — build debug binaries (gn-drive + GNDriveApp)
#   task dist    — release build + bundle dist/GNDrive.app
#   task dev     — rebuild & relaunch the app on file change (hot reload)
#   task test    — run the XCTest suite
#   task doctor  — run gn-drive doctor
#
# The Go backend + Vue frontend remain in-tree for reference only and no
# longer have build tasks.

version: "3"

vars:
  VERSION: '{{.VERSION | default "dev"}}'

tasks:
  build:
    summary: Build debug binaries (gn-drive CLI + GNDriveApp)
    cmds:
      - swift build --product gn-drive
      - swift build --product GNDriveApp

  dist:
    summary: Release build + bundle dist/GNDrive.app (app binary + CLI inside)
    cmds:
      - scripts/bundle-app.sh release "{{.VERSION}}"

  dev:
    summary: Hot reload — rebuild & relaunch GNDriveApp when Sources/ change
    cmds:
      - scripts/dev-swift.sh

  test:
    summary: Run the Swift test suite
    cmds:
      - swift test

  doctor:
    summary: Diagnose environment via gn-drive doctor
    cmds:
      - swift run gn-drive doctor

  run:
    summary: Run the gn-drive CLI in foreground (debug build)
    cmds:
      - swift run gn-drive run

  clean:
    summary: Clean Swift build artifacts
    cmds:
      - rm -rf .build dist
      - echo "Cleaned build artifacts"
